name: Fuzz Test

on:
  workflow_call:
    inputs:
      fuzz-duration-sec:
        description: 'Duration in seconds for each fuzz target'
        type: number
        default: 300
      sync-sha:
        description: 'Commit SHA to sync the branch to before running (used when chained after other release jobs)'
        type: string
        default: ''

jobs:
  fuzz:
    name: Fuzz
    runs-on: LargeSizeRunner
    timeout-minutes: 60
    env:
      FUZZ_LOG: quality/assets/fuzzing_vehicle-api.log
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync branch
        if: inputs.sync-sha != ''
        run: |
          git fetch origin ${{ github.ref_name }}
          git reset --hard ${{ inputs.sync-sha }}

      - name: docker login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build C++ fuzz harnesses
        run: |
          docker container run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            --entrypoint /init \
            ${{ vars.DEVCONTAINER_IMAGE }} \
            bash -lc '
            set -euo pipefail
            mkdir -p /work/build_fuzz && cd /work/build_fuzz
            cmake -DCMAKE_CXX_COMPILER=afl-g++ \
              -DENABLE_FUZZ_TESTS=ON \
              -DENABLE_ASAN=ON \
              -DENABLE_UBSAN=ON \
              -DENABLE_LOG_BACKEND_DLT=OFF \
              ..
            make -j$(nproc)'

      - name: Fuzz
        run: |
          set -o pipefail
          mkdir -p quality/assets
          : > "$FUZZ_LOG"
          docker container run --rm \
            -v ${{ github.workspace }}:/work \
            -w /work \
            --entrypoint /init \
            ${{ vars.DEVCONTAINER_IMAGE }} \
            bash -lc '
            set -euo pipefail
            test_fuzz/run_fuzz_all.sh ${{ inputs.fuzz-duration-sec }}' \
            2>&1 | tee -a "$FUZZ_LOG"

      - name: Collect AFL++ statistics
        if: always()
        run: |
          {
            echo ""
            echo "=== AFL++ statistics per target ==="
            for log in ${{ github.workspace }}/findings/*/afl.log; do
              [ -f "$log" ] || continue
              echo ""
              echo "--- $(basename "$(dirname "$log")") ---"
              grep -a -E 'Statistics:|Time limit was reached' "$log" || echo "  (no statistics recorded)"
            done
          } >> "$FUZZ_LOG"

      - name: Check for crashes
        run: |
          crashes=$(find ${{ github.workspace }}/findings/*/default/crashes -type f -not -name 'README.txt' 2>/dev/null || true)
          if [ -n "$crashes" ]; then
            echo "=== Result: Crashes found. ===" | tee -a "$FUZZ_LOG"
          else
            echo "=== Result: No crashes found. ===" | tee -a "$FUZZ_LOG"
          fi
          if [ -n "$crashes" ]; then
            echo "::error::Fuzz crashes found (ASAN/UBSAN enabled):"
            echo "$crashes"
            exit 1
          fi
          echo "No crashes found."

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            ${{ github.workspace }}/findings/*/default/crashes/

      - name: Upload fuzz evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-evidence
          path: quality/assets/fuzzing_vehicle-api.log
