name: Run cpplint

on:
  workflow_call:

jobs:
  cpplint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run cpplint
        run: |
          pip install cpplint
          cpplint --recursive --exclude=build --exclude=cmake --exclude=mock --exclude=test --exclude=test_fuzz --root=. .  2> cpplint.log || true

      - name: Parse cpplint results
        run: |
          cd ${{github.workspace}}
          if [ -s cpplint.log ]; then
            python3 ./cpplint_parse.py
          else
            echo "No cpplint result found."
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: cpplint-result
          path: summary.md
