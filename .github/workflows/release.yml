# .github/workflows/release.yml

name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - 'security-reports/**'
      - 'quality/assets/**'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      initial-development:
        description: 'Create an initial release'
        required: false
        default: true
        type: boolean
      prerelease:
        description: 'Create a prerelease'
        required: false
        default: true
        type: boolean
      prerelease-suffix:
        description: 'Suffix for the prerelease version'
        required: false
        default: 'rc'
        type: string
      tag-prefix:
        description: 'Prefix for the release tag'
        required: false
        default: 'v'
        type: string

env:
  POLARIS_ACCESS_TOKEN: ${{ secrets.POLARIS_ACCESS_TOKEN }}
  REPORT_DIR: security-reports/polaris
  
permissions:
  contents: write
  packages: write

jobs:
  # ================================================================
  # Validation when merging to main
  # ================================================================
  lint:
    name: Linting
    uses: ./.github/workflows/_lint.yml
    secrets: inherit
  build-test:
    name: Build and Test
    uses: ./.github/workflows/_build-test.yml
    secrets: inherit

  # ================================================================
  # Polaris
  # ================================================================
  polaris:
    name: Polaris
    runs-on: ubuntu-latest
    needs: build-test
    if: ${{ vars.IS_POLARIS_ENABLED == 'true' }}
    outputs:
      polaris-sha: ${{ steps.capture-sha.outputs.sha }}
      
    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Polaris Security Scan
        uses: yoriito/actions/polaris@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          polaris_project_name: ${{ vars.POLARIS_PROJECT_NAME }}
          polaris_branch_name: ${{ github.ref_name }}
          detect_search_depth: ${{ vars.DETECT_SEARCH_DEPTH }}

      - name: Capture Polaris HEAD
        id: capture-sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Current HEAD:"
          git rev-parse HEAD

  # ================================================================
  # Fuzz
  # ================================================================
  fuzz:
    name: Fuzz
    needs: polaris
    if: ${{ vars.IS_POLARIS_ENABLED == 'true' && needs.polaris.result == 'success' }}
    uses: ./.github/workflows/_fuzz.yml
    secrets: inherit
    with:
      fuzz-duration-sec: 300
      sync-sha: ${{ needs.polaris.outputs.polaris-sha }}

  # ================================================================
  # Release Artifacts
  # (generates the SBOM markdown report, collects the fuzz evidence
  # uploaded by the fuzz job, then commits and pushes both together
  # as a single commit)
  # ================================================================
  release-artifacts:
    name: Release Artifacts
    runs-on: ubuntu-latest
    needs: [polaris, fuzz]
    if: ${{ vars.IS_POLARIS_ENABLED == 'true' && needs.polaris.result == 'success' && needs.fuzz.result == 'success' }}
    outputs:
      artifacts-sha: ${{ steps.capture-sha.outputs.sha }}

    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Sync branch to Polaris commit
        run: |
          echo "Polaris SHA: ${{ needs.polaris.outputs.polaris-sha }}"
          git fetch origin ${{ github.ref_name }}
          git reset --hard ${{ needs.polaris.outputs.polaris-sha }}

      - name: Generate SPDX Markdown Reports
        uses: yoriito/actions/sbom_md-report@main

      - name: Download fuzz evidence
        uses: actions/download-artifact@v4
        with:
          name: fuzz-evidence
          path: quality/assets

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add security-reports quality/assets
          if ! git diff --cached --quiet; then
            git commit -m "docs: generate SPDX markdown reports and record fuzz test evidence"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "No changes"
          fi

      - name: Capture HEAD
        id: capture-sha
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "Current HEAD:"
          git rev-parse HEAD

  # ================================================================
  # Release
  # ================================================================
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: release-artifacts
    if: ${{ always() && github.ref_name == 'main' }}
    outputs:
      release-created: ${{ steps.release.outputs.release-created }}
      version: ${{ steps.release.outputs.version }}
      tag-name: ${{ steps.release.outputs.tag-name }}
      bump-type: ${{ steps.release.outputs.bump-type }}

    steps:
      - name: Generate Github App Token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_BOT_ID }}
          private-key: ${{ secrets.RELEASE_BOT_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
          fetch-tags: true

      - name: Sync branch to Release Artifacts commit
        if: ${{ vars.IS_POLARIS_ENABLED == 'true' }}
        run: |
          echo "Release Artifacts SHA: ${{ needs.release-artifacts.outputs.artifacts-sha }}"
          git fetch origin ${{ github.ref_name }} --tags
          git reset --hard ${{ needs.release-artifacts.outputs.artifacts-sha }}

      # ================================================================
      # RELEASE
      # - Analyze commits and determine version
      # - Generate CHANGELOG
      # - Commit CHANGELOG, create tag, and Github Release
      # ================================================================
      - name: Release
        id: release
        uses: yoriito/actions/semantic-release@main
        with:
          token: ${{ steps.app-token.outputs.token }}
          initial-development: ${{ github.event.inputs.initial-development || vars.INITIAL_DEVELOPMENT || true }}
          prerelease: ${{ github.event.inputs.prerelease || vars.PRERELEASE || true }}
          prerelease-suffix: ${{ github.event.inputs.prerelease-suffix || vars.PRERELEASE_SUFFIX || 'rc' }}
          tag-prefix: ${{ github.event.inputs.tag-prefix || vars.TAG_PREFIX || 'v' }}

      - name: Summary
        run: |
          if [ "${{ steps.release.outputs.release-created }}" = "true" ]; then
            echo "## 🎉 Release Created" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Version | ${{ steps.release.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Tag | ${{ steps.release.outputs.tag-name }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Type | ${{ steps.release.outputs.bump-type }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Pre-release | ${{ steps.release.outputs.is-prerelease }} |" >> $GITHUB_STEP_SUMMARY
            echo "| Initial Development | ${{ steps.release.outputs.is-initial-dev }} |" >> $GITHUB_STEP_SUMMARY
          else
            echo "## ℹ️ No Release Needed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No conventional commits found since last release." >> $GITHUB_STEP_SUMMARY
          fi

  # ================================================================
  # Optional: Additional job that runs after release
  # ================================================================
  docs:
    name: Generate & Deploy Documentation
    needs: release
    if: needs.release.outputs.release-created == 'true'
    uses: ./.github/workflows/_docs.yml
    secrets: inherit
