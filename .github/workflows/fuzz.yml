name: Fuzz

on:
  workflow_dispatch:
    inputs:
      fuzz-duration-sec:
        description: 'Duration in seconds for each fuzz target'
        required: false
        default: '300'
        type: string

jobs:
  fuzz:
    name: Fuzz Test
    uses: ./.github/workflows/_fuzz.yml
    secrets: inherit
    with:
      fuzz-duration-sec: ${{ fromJSON(inputs.fuzz-duration-sec || '30') }}