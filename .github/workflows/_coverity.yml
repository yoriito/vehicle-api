name: Run coverity to make reports

on:
  workflow_dispatch:
  workflow_call:

# required secrets
# COV_URL: URL of the Coverity server.
# COV_STREAM: Name of the Coverity stream.
# COV_USER: Username for Coverity.
# ANALYSIS_UPLOAD_KEY: Token for uploading defects to Coverity.

jobs:
  coverity:
    runs-on: [self-hosted, Linux, X64, yoriito-code-analysis-agent]
    steps:
      - uses: actions/checkout@v6

      - name: Run coverity for CWE checks
        run: |
          cd ${{github.workspace}}
          rm -rf build
          mkdir -p build/idir
          cd build
          cmake ..
          ${{ secrets.ANALYSIS_RUNNER }}/bin/cov-build --dir idir --emit-complementary-info make -j 12
          ${{ secrets.ANALYSIS_RUNNER }}/bin/cov-analyze --dir idir --all
          ${{ secrets.ANALYSIS_RUNNER }}/bin/cov-format-errors --dir idir --html-output coverity-report-cwe
          ${{ secrets.ANALYSIS_RUNNER }}/bin/cov-commit-defects --dir idir --url ${{ secrets.COV_URL }} --stream ${{ secrets.COV_STREAM }}-CWE --user ${{ secrets.COV_USER }} --password ${{secrets.ANALYSIS_UPLOAD_KEY}}

      - name: Run coverity for C++ MISRA checks
        run: |
          cd ${{github.workspace}}/build
          ${{ secrets.ANALYSIS_RUNNER }}/bin/cov-analyze --dir idir --disable-default --coding-standard-config ${{ secrets.ANALYSIS_RUNNER }}/config/coding-standards/misracpp2023/misracpp2023-all.config
          ${{ secrets.ANALYSIS_RUNNER }}/bin/cov-format-errors --dir idir --html-output coverity-report-misra
          ${{ secrets.ANALYSIS_RUNNER }}/bin/cov-commit-defects --dir idir --url ${{ secrets.COV_URL }} --stream ${{ secrets.COV_STREAM }}-MISRA --user ${{ secrets.COV_USER }} --password ${{secrets.ANALYSIS_UPLOAD_KEY}}

      - name: Run coverity for C++ CERT checks
        run: |
          cd ${{github.workspace}}/build
          ${{ secrets.ANALYSIS_RUNNER }}/bin/cov-analyze --dir idir --disable-default --coding-standard-config ${{ secrets.ANALYSIS_RUNNER }}/config/coding-standards/cert-cpp/cert-cpp-all.config
          ${{ secrets.ANALYSIS_RUNNER }}/bin/cov-format-errors --dir idir --html-output coverity-report-cert
          ${{ secrets.ANALYSIS_RUNNER }}/bin/cov-commit-defects --dir idir --url ${{ secrets.COV_URL }} --stream ${{ secrets.COV_STREAM }}-CERT --user ${{ secrets.COV_USER }} --password ${{secrets.ANALYSIS_UPLOAD_KEY}}

      # Upload the coverity result files as artifacts. These files are only available for 5 days.
      # If you want to check detail, please check it on the web application that is running on the local machine.
      - name: Upload coverity result files to artifacts
        uses: actions/upload-artifact@v6
        with:
          name: coverity-result
          path: |
            ${{github.workspace}}/build/coverity-report-cwe/summary.html
            ${{github.workspace}}/build/coverity-report-cwe/index*.html
            ${{github.workspace}}/build/coverity-report-misra/summary.html
            ${{github.workspace}}/build/coverity-report-misra/index*.html
            ${{github.workspace}}/build/coverity-report-cert/summary.html
            ${{github.workspace}}/build/coverity-report-cert/index*.html
          retention-days: 5
