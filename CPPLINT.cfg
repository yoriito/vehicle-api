# Stop searching for CPPLINT.cfg in parent directories
set noparent

# Enabled cpplint checks (disabled by default)
filter=+build/deprecated
filter=+readability/casting
filter=+readability/inheritance
filter=+runtime/printf

# Disabled cpplint checks
filter=-build/c++11
filter=-build/include_what_you_use

# Relax the max line length from the default 80 to 130 chars
linelength=130
