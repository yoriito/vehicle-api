name: Build and Test on devcontainer(desktop environment)

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: LargeSizeRunner
    steps:
    - uses: actions/checkout@v6

    - name: docker login
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

    - name: Start Docker Container
      run: |
        docker container run -d \
          --name builder \
          -v "${{ github.workspace }}:/work" \
          -w /work \
          --entrypoint /init \
          --cap-add NET_ADMIN \
          ${{ vars.DEVCONTAINER_IMAGE }}

        echo "Waiting for s6 services to start..."
        for i in $(seq 1 ${{ vars.SERVICE_WAIT_SEC }}); do
          if docker exec builder grep -q "0100007F:${{ vars.LISTEN_PORT_HEX }}" /proc/net/tcp 2>/dev/null; then
            echo "Services ready (attempt ${i})"
            break
          fi
          sleep 1
        done
        if ! docker exec builder grep -q "0100007F:${{ vars.LISTEN_PORT_HEX }}" /proc/net/tcp 2>/dev/null; then
          echo "ERROR: Services not ready after ${{ vars.SERVICE_WAIT_SEC }}s"
          docker exec builder /bin/bash -lc '/command/s6-rc -a list' 2>/dev/null || true
          exit 1
        fi

    - name: Configure
      run: |
        docker exec builder /bin/bash -lc '
            set -euo pipefail
            cmake -S /work -B /work/build -DENABLE_TESTS=ON
          '

    - name: Build
      run: |
        docker exec builder /bin/bash -lc '
            set -euo pipefail
            cmake --build /work/build -j$(nproc)
          '

    - name: Unit Test
      continue-on-error: true
      run: |
        docker exec builder /bin/bash -lc '
            set -euo pipefail
            ctest --test-dir /work/build --output-junit /work/result.xml
          '
    - name: Stop Docker Container
      if: always()
      run: |
        docker rm -f builder

    - name: Install junit2html
      if: always()
      run: python3 -m pip install junit2html --quiet

    - name: Generate Unit Test HTML Report
      if: always() && hashFiles('result.xml') != ''
      run: junit2html result.xml unit-test-report.html

    - name: Upload Unit Test Report
      if: always() && hashFiles('unit-test-report.html') != ''
      uses: actions/upload-artifact@v6
      with:
        name: unit-test-results
        path: |
          result.xml
          unit-test-report.html
        retention-days: 7
