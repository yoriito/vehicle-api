name: Run lizard

on:
  workflow_call:

jobs:
  lizard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prepare lizard
        run: |
          cd ${{github.workspace}}
          python3 -m venv .venv
          source .venv/bin/activate
          pip install lizard
          pip install jinja2

      - name: Run lizard
        run: |
          cd ${{github.workspace}}
          source .venv/bin/activate
          lizard -l cpp -C 25 -L 100 -a 10 -w -x "./test/*" -x "./access/*" -x "./common/databroker/base_inspect_data.h"
          lizard -l cpp -C 25 -L 100 -a 10 -x "./test/*" -x "./access/*" -x "./common/databroker/base_inspect_data.h" --html > lizard_result.html
          deactivate

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: lizard-result
          path: ${{github.workspace}}/lizard_result.html
